# cargo-deny config

[advisories]
ignore = ["RUSTSEC-2024-0436", "RUSTSEC-2026-0098", "RUSTSEC-2026-0099", "RUSTSEC-2026-0104", "RUSTSEC-2026-0173", "RUSTSEC-2026-0177", "RUSTSEC-2026-0178", "RUSTSEC-2026-0023", "RUSTSEC-2026-0190"]

[licenses]
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib", "0BSD", "CDLA-Permissive-2.0", "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
