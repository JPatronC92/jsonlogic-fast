name: Build and Deploy

on:
  push:
    branches:
      - main
      - feature-b2a-api*

jobs:
  build_and_deploy:
    name: Build Rust Lambdas and Apply Terraform
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install cargo-lambda
        uses: jaxxstorm/action-install-gh-release@v1.9.0
        with:
          repo: cargo-lambda/cargo-lambda
          tag: v1.0.0
          platform: linux
          arch: x86_64

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        working-directory: ./api
        run: cargo test

      - name: Build API Lambda
        working-directory: ./api
        run: cargo lambda build --release --arm64 --bin lambda

      - name: Build Slasher Lambda
        working-directory: ./api
        run: cargo lambda build --release --arm64 --bin slasher

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.5.0"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -var="private_key=${{ secrets.PRIVATE_KEY }}" -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan
